<script>
/* Si el teléfono tiene activado "Sitio para computadoras", la página se ve diminuta: aquí se corrige */
(function () { try { const corto = Math.min(screen.width, screen.height);
  if (navigator.maxTouchPoints > 0 && corto < 700 && innerWidth > corto * 1.4) document.documentElement.style.zoom = (innerWidth / corto).toFixed(3); } catch (e) {} })();
/* =====================================================================
   CONFIGURACIÓN — pega aquí los datos de tu proyecto Supabase.
   Vacío = modo demostración (datos de prueba en el teléfono).
   ===================================================================== */
const CFG = { url: 'https://vtotyeilmskrgequjhou.supabase.co', key: 'sb_publishable_0oMOHhqNcqfU0ylqw3XOpg_2ve38KOU', vapid: '' };   // vapid = llave pública para avisos push (ver LEEME)
const VERSION = '2.2';

/* ---------- utilidades ---------- */
const nz = (a, b) => a === null || a === undefined ? b : a;
const $ = s => document.querySelector(s);
const esc = s => String(nz(s, '')).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => iso(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const lunes = s => { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fCorta = s => { const d = parseD(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; };
const hm = t => (t || '').slice(0, 5);
const min = t => { const [h, m] = hm(t).split(':').map(Number); return h * 60 + m; };
const aHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const n1 = v => v == null || isNaN(v) ? '—' : (+v).toLocaleString('es-MX', { maximumFractionDigits: 1 });
const n2 = v => v == null || isNaN(v) ? '—' : (+v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const corto = n => { const p = String(n || '').trim().split(/\s+/); return p.length > 2 ? p[0] + ' ' + p[p.length - 2] : p.join(' '); };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
function hoja(html, alAbrir) {
  const e = document.createElement('div'); e.className = 'hoja';
  e.innerHTML = '<div>' + html + '</div>';
  e.onclick = ev => { if (ev.target === e || ev.target.dataset.cerrar != null) e.remove(); };
  document.body.appendChild(e); alAbrir && alAbrir(e.firstChild, () => e.remove());
}
const semaforo = (v, meta, tol) => v == null ? '' : v >= meta ? 'ok' : v >= meta * (1 - tol / 100) ? 'warn' : 'mal';

/* =====================================================================
   DATOS — dos motores con la misma interfaz:
   Remoto (Supabase, permisos en el servidor) y Demo (en el teléfono).
   ===================================================================== */
const Remoto = (() => {
  let ses = LS.get('esto_ses', null);
  const H = () => ({ apikey: CFG.key, Authorization: 'Bearer ' + (ses ? ses.access_token : CFG.key), 'Content-Type': 'application/json' });
  async function refrescar() {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: ses.refresh_token }) });
    if (!r.ok) { ses = null; LS.del('esto_ses'); throw new Error('Tu sesión terminó, vuelve a entrar'); }
    ses = await r.json(); LS.set('esto_ses', ses);
  }
  async function req(path, opt = {}, otra) {
    let r;
    try { r = await fetch(CFG.url + path, { ...opt, headers: { ...H(), ...(opt.headers || {}) } }); }
    catch (e) { throw new Error('Sin conexión con el servidor. Revisa tu internet. Si el teléfono es de la empresa, pide a sistemas que permita supabase.co'); }
    if (r.status === 401 && ses && !otra) { await refrescar(); return req(path, opt, true); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw new Error((j && (j.message || j.msg || j.error_description)) || 'Error de conexión');
    return j;
  }
  const get = (t, q) => req('/rest/v1/' + t + '?' + q);
  // Trae TODO aunque pase de 1,000 filas (el servidor entrega de 1,000 en 1,000)
  async function todo(path, body) { const out = []; for (let off = 0; off < 200000; off += 1000) {
      const url = '/rest/v1/' + (body ? 'rpc/' : '') + path + (path.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off;
      const r = await req(url, body ? { method: 'POST', body: JSON.stringify(body) } : {}); out.push(...r); if (r.length < 1000) break; } return out; }
  const rpc = (f, a) => req('/rest/v1/rpc/' + f, { method: 'POST', body: JSON.stringify(a || {}) });
  const ins = (t, row) => req('/rest/v1/' + t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) });
  const upd = (t, q, row) => req('/rest/v1/' + t + '?' + q, { method: 'PATCH', body: JSON.stringify(row) });
  const del = (t, q) => req('/rest/v1/' + t + '?' + q, { method: 'DELETE' });
  return {
    haySesion: () => !!ses,
    async entrar(u, p) {
      const correo = await rpc('resolver_usuario', { p: u });
      if (!correo) throw new Error('Usuario no encontrado');
      let r; try { r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: correo, password: p }) }); } catch (e) { throw new Error('Sin conexión con el servidor. Revisa tu internet. Si el teléfono es de la empresa, pide a sistemas que permita supabase.co'); }
      if (!r.ok) throw new Error('Contraseña incorrecta');
      ses = await r.json(); LS.set('esto_ses', ses);
    },
    salir() { ses = null; LS.del('esto_ses'); },
    async yo() { const id = ses.user.id; const r = await get('perfiles', 'select=usuario,clave,nombre,rol&id=eq.' + id); return r[0]; },
    corridas: (f, clave) => get('corridas', 'select=id,hora,hora_fin,tipo,tipo_ruta,ruta,unidad,clave,km_programado,km_real,proxima_ruta&fecha=eq.' + f + (clave ? '&clave=eq.' + clave : '') + '&order=hora.asc.nullslast'),
    operadores: () => get('operadores', 'select=clave,nombre,busup,estatus,ruta_asignada,unidad_base&order=nombre'),
    unidades: () => get('unidades', 'select=numero,marca,modelo,capacidad_tanque_l,capacidad_confirmada,meta_km_l,minimo_km_l,ruta_rend,km_dia_ref&order=numero'),
    estadoTanque: u => rpc('estado_tanque', u ? { p_unidad: u } : {}),
    lavadoConfig: async () => (await get('lavado_config', 'select=*'))[0],
    lavados: (a, b) => get('lavados', 'select=id,fecha,hora,unidad,clave,nombre,estado,nota&estado=neq.cancelado&fecha=gte.' + a + '&fecha=lte.' + b + '&order=fecha,hora'),
    agendar: (fecha, hora, unidad) => rpc('agendar_lavado', { p_fecha: fecha, p_hora: hora, p_unidad: unidad }),
    cancelar: id => rpc('cancelar_lavado', { p_id: id }),
    marcar: (id, estado, nota) => rpc('marcar_lavado', { p_id: id, p_estado: estado, p_nota: nota || null }),
    tickets: (a, b) => get('tickets', 'select=*&fecha=gte.' + a + '&fecha=lte.' + b + '&order=fecha.desc,creado.desc'),
    lecturas: (a, b) => get('lecturas', 'select=*&fecha=gte.' + a + '&fecha=lte.' + b + '&order=creado.desc'),
    addTicket: r => ins('tickets', r), addLectura: r => ins('lecturas', r),
    delTicket: id => del('tickets', 'id=eq.' + id), delLectura: id => del('lecturas', 'id=eq.' + id),
    rendimiento: (a, b) => todo('rendimiento', { p_desde: a, p_hasta: b }),
    tags: (a, b) => get('cargas_tag', 'select=fecha,unidad,litros&fecha=gte.' + a + '&fecha=lte.' + b),
    guia: () => get('guia', 'select=*&order=orden'),
    criterios: () => get('bono_criterios', 'select=*&order=orden'),
    ajustes: async () => Object.fromEntries((await get('ajustes', 'select=*')).map(r => [r.clave, r.valor])),
    setAjuste: (k, v) => req('/rest/v1/ajustes', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify({ clave: k, valor: String(v) }) }),
    guardarGuia: async rows => { await del('guia', 'id=gt.0'); if (rows.length) await ins('guia', rows); },
    guardarCriterios: async rows => { await del('bono_criterios', 'id=gt.0'); if (rows.length) await ins('bono_criterios', rows); },
    reportes: () => get('reportes', 'select=*&order=creado.desc&limit=60'),
    async exportar(a, b) { const z = addD(b, 1), r = 'fecha=gte.' + a + '&fecha=lte.' + b, c = 'creado=gte.' + a + 'T00:00:00-06:00&creado=lt.' + z + 'T00:00:00-06:00';
      const [tickets, lecturas, lavados, fallas, reportes, tags] = await Promise.all([todo('tickets?select=*&order=fecha,id&' + r), todo('lecturas?select=*&order=fecha,id&' + r),
        todo('lavados?select=*&order=fecha,hora&' + r), todo('fallas?select=*&order=creado&' + c), todo('reportes?select=*&order=creado&' + c), todo('cargas_tag?select=fecha,unidad,litros&' + r)]);
      return { tickets, lecturas, lavados, fallas, reportes, tags }; },
    addReporte: r => ins('reportes', r),
    atender: id => upd('reportes', 'id=eq.' + id, { atendido: true }),
    cargarHorario: (f, filas, nombre) => rpc('cargar_horario', { p_fecha: f, p_filas: filas, p_nombre: nombre }),
    cargarTags: (filas, nombre) => rpc('cargar_tags', { p_filas: filas, p_nombre: nombre }),
    setCapacidad: (n, l) => upd('unidades', 'numero=eq.' + n, { capacidad_tanque_l: l, capacidad_confirmada: true }),
    setLavadoConfig: c => upd('lavado_config', 'id=eq.1', c),
    usuarios: () => get('perfiles', 'select=id,usuario,clave,nombre,rol,activo&order=rol,nombre'),
    crearUsuario: (u, n, r, p) => rpc('admin_crear_usuario', { p_usuario: u, p_nombre: n, p_rol: r, p_pass: p }),
    resetPass: id => rpc('admin_reset_pass', { p_id: id, p_pass: '123456' }),
    setActivo: (id, v) => rpc('admin_activo', { p_id: id, p_activo: v }),

/* Memoria corta de lecturas: la app responde al instante al cambiar de pantalla y gasta menos datos.
   Cualquier cambio (guardar, borrar, subir) limpia la memoria para no mostrar datos viejos. */
function conCache(api) {
  const LEER = new Set(['corridas', 'operadores', 'unidades', 'lavadoConfig', 'lavados', 'tickets', 'lecturas', 'rendimiento', 'tags', 'guia', 'criterios', 'ajustes', 'reportes', 'misKm', 'fallas', 'miUnidad', 'cambiosUnidad', 'bitacora', 'usuarios', 'estadoTanque', 'yo']);
  const LARGO = { unidades: 6 * 36e5, guia: 36e5, criterios: 36e5, lavadoConfig: 6e5, ajustes: 6e5, operadores: 36e5 };
  const mem = new Map(), out = { demo: api.demo };
  const limpia = () => { mem.clear(); Object.keys(LARGO).forEach(k => LS.del('esto_c_' + k)); };
  for (const k of Object.keys(api)) {
    const f = api[k]; if (typeof f !== 'function') continue;
    if (k === 'haySesion') { out[k] = (...a) => f.apply(api, a); continue; }
    if (k === 'entrar' || k === 'salir') { out[k] = (...a) => { limpia(); return f.apply(api, a); }; continue; }
    if (!LEER.has(k)) { out[k] = async (...a) => { const r = await f.apply(api, a); limpia(); return r; }; continue; }
    out[k] = (...a) => {
      const key = k + JSON.stringify(a), ttl = LARGO[k] || 45e3, hit = mem.get(key);
      if (hit && Date.now() - hit.t < ttl) return hit.p;
      if (LARGO[k] && !a.length) { const g = LS.get('esto_c_' + k, null); if (g && Date.now() - g.t < ttl) { const p = Promise.resolve(g.v); mem.set(key, { t: g.t, p }); return p; } }
      const p = f.apply(api, a); mem.set(key, { t: Date.now(), p });
      p.then(v => { if (LARGO[k] && !a.length) LS.set('esto_c_' + k, { t: Date.now(), v }); }, () => mem.delete(key));
      return p;
    };
  }
  return out;
}

const GRAV = { no_circula: ['No puede circular', 'mal'], urgente: ['Circula, pero urge', 'warn'], normal: ['Circula sin problema', ''] };

const EST_F = { pendiente: ['Pendiente', 'warn'], revision: ['En revisión', ''], reparada: ['Reparada', 'ok'], no_procede: ['No procede', ''] };
const diasDesde = t => Math.max(0, Math.floor((Date.now() - new Date(t).getTime()) / 864e5));
// Prioridad: gravedad + veces + desde cuándo + otros operadores que confirman + reincidencias + días esperando
function prioridad(f, todas) {
  const rein = todas.filter(x => x.id !== f.id && x.unidad === f.unidad && x.categoria === f.categoria && diasDesde(x.creado) <= 60).length;
  const p = ({ no_circula: 50, urgente: 30, normal: 10 })[f.gravedad] + ({ '1': 0, '2': 10, '3+': 20 })[f.veces] + ({ hoy: 0, semana: 5, mas_semana: 10, mas_mes: 15 })[f.desde]
    + Math.min(20, (f.confirmaciones || 0) * 5) + Math.min(20, rein * 10) + Math.min(20, diasDesde(f.creado) * 2);
  return { puntos: p, nivel: p >= 60 ? 'ALTA' : p >= 35 ? 'MEDIA' : 'BAJA', cls: p >= 60 ? 'mal' : p >= 35 ? 'warn' : '', rein };
}
function proximaGuardia() {
  const dias = String(E.aj.taller_dias || '1,3,5').split(',').map(Number); const d = new Date();
  for (let i = 0; i < 8; i++) { const x = new Date(d); x.setDate(d.getDate() + i); const dw = ((x.getDay() + 6) % 7) + 1; if (dias.includes(dw) && (i > 0 || d.getHours() < 18)) return iso(x); }
  return hoy();
}

      if (res === 'permiso') toast('Acepta el permiso y vuelve a tocar Descargar'); else if (res !== 'ok') toast('No se pudo guardar: ' + res); };

    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +

      '<definedNames>' + hojas.map((h, i) => h.filas.length > 1 ? '<definedName name="_xlnm._FilterDatabase" localSheetId="' + i + '" hidden="1">\'' + X(h.nombre.slice(0, 31)) + '\'!$A$1:$' + col(h.filas[0].length - 1) + '$' + h.filas.length + '</definedName>' : '').join('') + '</definedNames></workbook>'],

const aFecha = v => { if (v instanceof Date) return iso(v); if (typeof v === 'number') return iso(new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset() * 6e4)); const m = String(v || '').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(m[2]) + '-' + pad(m[1]); const i = String(v || '').match(/\d{4}-\d\d-\d\d/); return i ? i[0] : null; };
