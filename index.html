a{color:var(--pri2)}

<script>
/* =====================================================================
   CONFIGURACIÓN — pega aquí los datos de tu proyecto Supabase.
   Vacío = modo demostración (datos de prueba en el teléfono).
   ===================================================================== */
const CFG = { url: 'https://vtotyeilmskrgequjhou.supabase.co', key: 'sb_publishable_0oMOHhqNcqfU0ylqw3XOpg_2ve38KOU', vapid: '' };   // vapid = llave pública para avisos push (ver LEEME)
const VERSION = '1.5';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => iso(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const lunes = s => { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fCorta = s => { const d = parseD(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; };
const hm = t => (t || '').slice(0, 5);
const min = t => { const [h, m] = hm(t).split(':').map(Number); return h * 60 + m; };
const aHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const n1 = v => v == null || isNaN(v) ? '—' : (+v).toLocaleString('es-MX', { maximumFractionDigits: 1 });
const n2 = v => v == null || isNaN(v) ? '—' : (+v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const corto = n => { const p = String(n || '').trim().split(/\s+/); return p.length > 2 ? p[0] + ' ' + p[p.length - 2] : p.join(' '); };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
function hoja(html, alAbrir) {
  const e = document.createElement('div'); e.className = 'hoja';
  e.innerHTML = '<div>' + html + '</div>';
  e.onclick = ev => { if (ev.target === e || ev.target.dataset.cerrar != null) e.remove(); };
  document.body.appendChild(e); alAbrir && alAbrir(e.firstChild, () => e.remove());
}
const semaforo = (v, meta, tol) => v == null ? '' : v >= meta ? 'ok' : v >= meta * (1 - tol / 100) ? 'warn' : 'mal';

/* =====================================================================
   DATOS — dos motores con la misma interfaz:
   Remoto (Supabase, permisos en el servidor) y Demo (en el teléfono).
   ===================================================================== */
const Remoto = (() => {
  let ses = LS.get('esto_ses', null);
  const H = () => ({ apikey: CFG.key, Authorization: 'Bearer ' + (ses ? ses.access_token : CFG.key), 'Content-Type': 'application/json' });
  async function refrescar() {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: ses.refresh_token }) });
    if (!r.ok) { ses = null; LS.del('esto_ses'); throw new Error('Tu sesión terminó, vuelve a entrar'); }
    ses = await r.json(); LS.set('esto_ses', ses);
  }
  async function req(path, opt = {}, otra) {
    const r = await fetch(CFG.url + path, { ...opt, headers: { ...H(), ...(opt.headers || {}) } });
    if (r.status === 401 && ses && !otra) { await refrescar(); return req(path, opt, true); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw new Error((j && (j.message || j.msg || j.error_description)) || 'Error de conexión');
    return j;
  }
  const get = (t, q) => req('/rest/v1/' + t + '?' + q);
  // Trae TODO aunque pase de 1,000 filas (el servidor entrega de 1,000 en 1,000)
  async function todo(path, body) { const out = []; for (let off = 0; off < 200000; off += 1000) {
      const url = '/rest/v1/' + (body ? 'rpc/' : '') + path + (path.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off;
      const r = await req(url, body ? { method: 'POST', body: JSON.stringify(body) } : {}); out.push(...r); if (r.length < 1000) break; } return out; }
  const rpc = (f, a) => req('/rest/v1/rpc/' + f, { method: 'POST', body: JSON.stringify(a || {}) });
  const ins = (t, row) => req('/rest/v1/' + t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) });
  const upd = (t, q, row) => req('/rest/v1/' + t + '?' + q, { method: 'PATCH', body: JSON.stringify(row) });
  const del = (t, q) => req('/rest/v1/' + t + '?' + q, { method: 'DELETE' });
  return {
    haySesion: () => !!ses,
    async entrar(u, p) {
      const correo = await rpc('resolver_usuario', { p: u });
      if (!correo) throw new Error('Usuario no encontrado');
      const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: correo, password: p }) });
      if (!r.ok) throw new Error('Contraseña incorrecta');
      ses = await r.json(); LS.set('esto_ses', ses);
    },
    salir() { ses = null; LS.del('esto_ses'); },
    async yo() { const id = ses.user.id; const r = await get('perfiles', 'select=usuario,clave,nombre,rol&id=eq.' + id); return r[0]; },
    corridas: (f, clave) => get('corridas', 'select=id,hora,hora_fin,tipo,tipo_ruta,ruta,unidad,clave,km_programado,km_real,proxima_ruta&fecha=eq.' + f + (clave ? '&clave=eq.' + clave : '') + '&order=hora.asc.nullslast'),
    operadores: () => get('operadores', 'select=clave,nombre,busup,estatus,ruta_asignada,unidad_base&order=nombre'),
    unidades: () => get('unidades', 'select=numero,marca,modelo,capacidad_tanque_l,capacidad_confirmada,meta_km_l&order=numero'),
    lavadoConfig: async () => (await get('lavado_config', 'select=*'))[0],
    lavados: (a, b) => get('lavados', 'select=id,fecha,hora,unidad,clave,nombre,estado,nota&estado=neq.cancelado&fecha=gte.' + a + '&fecha=lte.' + b + '&order=fecha,hora'),
    agendar: (fecha, hora, unidad) => rpc('agendar_lavado', { p_fecha: fecha, p_hora: hora, p_unidad: unidad }),
    cancelar: id => rpc('cancelar_lavado', { p_id: id }),
    marcar: (id, estado, nota) => rpc('marcar_lavado', { p_id: id, p_estado: estado, p_nota: nota || null }),
    tickets: (a, b) => get('tickets', 'select=*&fecha=gte.' + a + '&fecha=lte.' + b + '&order=fecha.desc,creado.desc'),
    lecturas: (a, b) => get('lecturas', 'select=*&fecha=gte.' + a + '&fecha=lte.' + b + '&order=creado.desc'),
    addTicket: r => ins('tickets', r), addLectura: r => ins('lecturas', r),
    delTicket: id => del('tickets', 'id=eq.' + id), delLectura: id => del('lecturas', 'id=eq.' + id),
    rendimiento: (a, b) => todo('rendimiento', { p_desde: a, p_hasta: b }),
    tags: (a, b) => get('cargas_tag', 'select=fecha,unidad,litros&fecha=gte.' + a + '&fecha=lte.' + b),
    guia: () => get('guia', 'select=*&order=orden'),
    criterios: () => get('bono_criterios', 'select=*&order=orden'),
    ajustes: async () => Object.fromEntries((await get('ajustes', 'select=*')).map(r => [r.clave, r.valor])),
    setAjuste: (k, v) => req('/rest/v1/ajustes', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify({ clave: k, valor: String(v) }) }),
    guardarGuia: async rows => { await del('guia', 'id=gt.0'); if (rows.length) await ins('guia', rows); },
    guardarCriterios: async rows => { await del('bono_criterios', 'id=gt.0'); if (rows.length) await ins('bono_criterios', rows); },
    reportes: () => get('reportes', 'select=*&order=creado.desc&limit=60'),
    async exportar(a, b) { const z = addD(b, 1), r = 'fecha=gte.' + a + '&fecha=lte.' + b, c = 'creado=gte.' + a + 'T00:00:00-06:00&creado=lt.' + z + 'T00:00:00-06:00';
      const [tickets, lecturas, lavados, fallas, reportes, tags] = await Promise.all([todo('tickets?select=*&order=fecha,id&' + r), todo('lecturas?select=*&order=fecha,id&' + r),
        todo('lavados?select=*&order=fecha,hora&' + r), todo('fallas?select=*&order=creado&' + c), todo('reportes?select=*&order=creado&' + c), todo('cargas_tag?select=fecha,unidad,litros&' + r)]);
      return { tickets, lecturas, lavados, fallas, reportes, tags }; },
    addReporte: r => ins('reportes', r),
    atender: id => upd('reportes', 'id=eq.' + id, { atendido: true }),
    cargarHorario: (f, filas, nombre) => rpc('cargar_horario', { p_fecha: f, p_filas: filas, p_nombre: nombre }),
    cargarTags: (filas, nombre) => rpc('cargar_tags', { p_filas: filas, p_nombre: nombre }),
    setCapacidad: (n, l) => upd('unidades', 'numero=eq.' + n, { capacidad_tanque_l: l, capacidad_confirmada: true }),
    setLavadoConfig: c => upd('lavado_config', 'id=eq.1', c),
    usuarios: () => get('perfiles', 'select=id,usuario,clave,nombre,rol,activo&order=rol,nombre'),
    crearUsuario: (u, n, r, p) => rpc('admin_crear_usuario', { p_usuario: u, p_nombre: n, p_rol: r, p_pass: p }),
    resetPass: id => rpc('admin_reset_pass', { p_id: id, p_pass: '123456' }),
    setActivo: (id, v) => rpc('admin_activo', { p_id: id, p_activo: v }),
    sincronizarOps: filas => rpc('sincronizar_operadores', { p_filas: filas }),
    misKm: (a, b, clave) => todo('mis_km', { p_desde: a, p_hasta: b, p_clave: clave || null }),
    cargarGps: (filas, nombre) => rpc('cargar_km_gps', { p_filas: filas, p_nombre: nombre }),
    guardarPush: s => req('/rest/v1/push_subs', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify(s) }),
    borrarPush: endpoint => del('push_subs', 'endpoint=eq.' + encodeURIComponent(endpoint)),
    fallas: desde => get('fallas', 'select=*&creado=gte.' + desde + '&order=creado.desc'),
    reportarFalla: (u, c, d, g, v, h) => rpc('reportar_falla', { p_unidad: u, p_categoria: c, p_descripcion: d, p_gravedad: g, p_veces: v, p_desde: h }),
    confirmarFalla: id => rpc('confirmar_falla', { p_id: id }),
    atenderFalla: (id, e, n) => rpc('atender_falla', { p_id: id, p_estado: e, p_nota: n || null }),
  };
})();

/* ---------- Motor demo: imita las mismas reglas del servidor ---------- */
const mkDemo = () => {
  const D = window.DEMO || { operadores: [], unidades: [], rutas: [], corridas: [] };
  const base = { tickets: [], lecturas: [], lavados: [], reportes: [], tags: [], seq: 1,
    cap: {}, cfg: { hora_inicio: '08:00', hora_fin: '16:00', comida_inicio: '13:00', comida_fin: '14:00', minutos: 60, cupo: 1, dias: [1, 2, 3, 4, 5] },
    ajustes: { meta_km_l: '3.8', tolerancia_pct: '7', taller_dias: '1,3,5' }, fallas: [],
    guia: [{"orden": 1, "titulo": "¿Qué es el servicio?", "texto": "Llevamos a los alumnos de la BUAP. Trabajamos para Estrella Roja.\n- Cada día revisa tus vueltas en Vueltas.\n- Si tienes una duda, pregunta a tu supervisor."}, {"orden": 2, "titulo": "Antes de salir", "texto": "- Revisa tu unidad.\n- Entra a Diésel.\n- Mueve la flecha como la ves en tu tablero.\n- Escribe los kilómetros del tablero.\n- Toca Guardar."}, {"orden": 3, "titulo": "Cuando cargas diésel", "texto": "- Pide tu ticket en la gasolinera.\n- Entra a Diésel y escribe los litros y los kilómetros.\n- Toca Guardar ticket.\n- Lo comparamos con lo que reporta la gasolinera.\n- La flecha es solo una guía: siempre revisa tu tablero.\n- Si te quedas sin diésel, el rescate, el taller y el diésel los pagas tú (desde $5,000). Carga con tiempo."}, {"orden": 4, "titulo": "Lavado de tu unidad", "texto": "- Es de lunes a viernes, de 8 de la mañana a 4 de la tarde.\n- De 1 a 2 el lavador come: no hay lavado.\n- Aparta tu hora en Lavado. Solo una vez por semana.\n- Llega a tu hora con tu unidad."}, {"orden": 5, "titulo": "Tu bono", "texto": "- Tu bono depende de varias cosas, como tu diésel.\n- En Calcula tu bono ves cuánto llevas.\n- Es un cálculo aproximado. El oficial lo hace supervisión."}],

function gaugeSVG() {
  const marcas = [0, .25, .5, .75, 1].map(f => { const a = Math.PI * (1 - f), x1 = 150 + 112 * Math.cos(a), y1 = 160 - 112 * Math.sin(a), x2 = 150 + 128 * Math.cos(a), y2 = 160 - 128 * Math.sin(a),
    tx = 150 + 92 * Math.cos(a) + (f === .5 ? 18 : 0), ty = 165 - 92 * Math.sin(a) + (f === .5 ? 8 : 0);
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="currentColor" stroke-width="3"/><text x="' + tx + '" y="' + ty + '" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">' + ['E', '¼', '½', '¾', 'F'][f * 4] + '</text>'; }).join('');
  return '<svg class="gauge" id="gz" viewBox="0 0 300 185"><path d="M22 160 A128 128 0 0 1 278 160" fill="none" stroke="var(--linea)" stroke-width="16" stroke-linecap="round"/>' +
    '<path id="garc" d="" fill="none" stroke="var(--pri)" stroke-width="16" stroke-linecap="round"/><g style="color:var(--gris)">' + marcas + '</g>' +
    '<g id="gn"><line x1="150" y1="160" x2="150" y2="48" stroke="var(--tinta)" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="160" r="11" fill="var(--acento)"/><circle cx="150" cy="160" r="4" fill="var(--carta)"/></g></svg>';
}
function montarGauge(onCambio, ini) {
  const svg = $('#gz'); let f = ini;
  const pinta = () => { const a = Math.PI * (1 - f), x = 150 + 128 * Math.cos(a), y = 160 - 128 * Math.sin(a);
    $('#gn').setAttribute('transform', 'rotate(' + (f * 180 - 90) + ' 150 160)');
    $('#garc').setAttribute('d', f > .005 ? 'M22 160 A128 128 0 0 1 ' + x.toFixed(1) + ' ' + y.toFixed(1) : ''); onCambio(f); };
  const mover = ev => { const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 300 - 150, y = 160 - (ev.clientY - r.top) / r.height * 185;
    let a = Math.atan2(Math.max(y, -40), x); if (a < 0) a = x < 0 ? Math.PI : 0; f = Math.round((1 - a / Math.PI) * 40) / 40; pinta(); };
  svg.onpointerdown = ev => { svg.setPointerCapture(ev.pointerId); mover(ev); svg.onpointermove = mover; };
  svg.onpointerup = svg.onpointercancel = () => { svg.onpointermove = null; };
  pinta(); return { get: () => f, pinta };
}

/* ---------- LAVADO ---------- */
function bloques(c) { const out = [], ci = min(c.comida_inicio), cf = min(c.comida_fin);
  for (let m = min(c.hora_inicio); m + c.minutos <= min(c.hora_fin); m += c.minutos) { out.push({ h: aHM(m), comida: m < cf && m + c.minutos > ci }); } return out; }
async function vLavado(sub) {
  const cfg = await API.lavadoConfig(); const lun = lunes(hoy());
  const ve = E.yo.rol === 'lavador' || esMando(), nAhora = new Date().getHours() * 60 + new Date().getMinutes();
  const ultimo = bloques(cfg).filter(b => !b.comida).map(b => min(b.h)).pop() || 0;
  const dias = []; for (let i = 0; i < 14; i++) { const d = addD(lun, i); const dw = ((parseD(d).getDay() + 6) % 7) + 1;
    if (d === hoy() && !ve && ultimo <= nAhora) continue;   // hoy ya no hay horarios: no se muestra al operador
    if (cfg.dias.includes(dw) && d >= hoy() && d <= addD(hoy(), 7)) dias.push(d); }
  const dia = dias.includes(sub) ? sub : dias[0];
  const lav = await API.lavados(lun, addD(lun, 13));
  const lavador = E.yo.rol === 'lavador';
  const miSem = d => lav.find(l => l.clave === E.yo.clave && E.yo.clave && lunes(l.fecha) === lunes(d));
  const ahora = new Date(), mAhora = ahora.getHours() * 60 + ahora.getMinutes();
  let h = '<h2>Rol de lavado</h2>';
  const mio = miSem(hoy()); const mioSig = miSem(addD(lun, 7));
  if (E.yo.rol === 'operador') {
    [mio, mioSig].filter(Boolean).forEach(l => { h += '<div class="aviso fila"><div class="f"><b>Tu lavado: ' + fCorta(l.fecha) + ' · ' + hm(l.hora) + '</b><br>Unidad ' + l.unidad + ' · ' + ({ agendado: 'Agendado', lavado: 'Lavado ✓', no_llego: 'No llegó' }[l.estado]) + '</div>' +
      (l.estado === 'agendado' ? '<button class="sec mini" data-cancel="' + l.id + '">Cancelar</button>' : '') + '</div>'; });
    if (!mio) h += '<p class="mut" style="margin-bottom:10px">Toca una hora en <b class="ok">verde</b> para apartarla. Solo una vez por semana.</p>';
    h += await tarjetaPush(!!mio);
  }
  if (!dias.length) { $('#m').innerHTML = h + '<div class="vacio">No hay días de lavado disponibles.</div>'; return; }
  h += '<div class="dias">' + dias.map(d => { const pd = parseD(d); return '<button class="' + (d === dia ? 'on' : '') + '" onclick="location.hash=\'lavado/' + d + '\'">' + (d === hoy() ? 'Hoy' : DIAS[pd.getDay()]) + '<br><b>' + pd.getDate() + '</b></button>'; }).join('') + '</div>';
  const delDia = lav.filter(l => l.fecha === dia);
  const ya = miSem(dia);
  let ocultos = 0;
  h += '<div id="slots">' + bloques(cfg).map(b => {
    const ocup = delDia.filter(l => hm(l.hora) === b.h), lleno = ocup.length >= cfg.cupo, paso = dia === hoy() && min(b.h) <= mAhora;
    const esMio = ocup.some(l => l.clave === E.yo.clave && E.yo.clave);
    if (paso && !esMio && (!ve || !ocup.length)) { ocultos++; return ''; }   // lo que ya pasó no se muestra
    let cls = 'slot', est = '';
    if (b.comida) { cls += ' no'; est = '<span class="mut">Comida del lavador</span>'; }
    else if (ocup.length) { est = ocup.map(l => '<div><b>U ' + l.unidad + '</b> · ' + esc(corto(l.nombre)) + ' ' + (l.estado === 'lavado' ? '<span class="chip ok">Lavado</span>' : l.estado === 'no_llego' ? '<span class="chip mal">No llegó</span>' : '') +
        (lavador || esMando() ? '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" data-mk="' + l.id + '" data-e="lavado">Lavado ✓</button><button class="sec mini" data-mk="' + l.id + '" data-e="no_llego">No llegó</button><button class="sec mini" data-rep="' + l.id + '" data-u="' + l.unidad + '">Reportar</button>' + (esMando() && l.estado === 'agendado' ? '<button class="sec mini" data-cancel="' + l.id + '">Quitar</button>' : '') + '</div>' : '') + '</div>').join('');
      if (esMio) cls += ' mio'; else if (lleno && !(lavador || esMando())) cls += '';
      if (lleno && !esMio && !(lavador || esMando())) cls += ' no'; }
    if (!b.comida && !lleno) {
      if (paso) { cls += ' no'; est += '<span class="mut">Ya pasó</span>'; }
      else if (lavador) { est += ocup.length ? '' : '<span class="mut">Libre</span>'; }
      else if (ya && E.yo.rol === 'operador') { cls += ' no'; est += '<span class="mut">Libre · ya apartaste esta semana</span>'; }
      else { cls += ' libre'; est += (ocup.length ? '<br>' : '') + '<span class="ok"><b>LIBRE</b> · toca para apartar</span>'; }
    } else if (!b.comida && lleno && !esMio && !ocup.length) { est = '<span class="mut">Ocupado</span>'; }
    return '<div class="' + cls + '" ' + (cls.includes('libre') ? 'data-slot="' + b.h + '"' : '') + '><div class="h">' + b.h + '</div><div class="f" style="flex:1">' + est + '</div></div>';
  }).join('') + '</div>';
  if (ocultos) h = h.replace('<div id="slots">', '<p class="mut" style="margin-bottom:8px">' + (ocultos === 1 ? 'Ya pasó 1 horario de hoy.' : 'Ya pasaron ' + ocultos + ' horarios de hoy.') + '</p><div id="slots">');
  h += '<button class="sec" style="margin-top:8px" id="rep">Avisar de un problema</button>';
  $('#m').innerHTML = h;
  document.querySelectorAll('[data-slot]').forEach(el => el.onclick = () => agendarHoja(dia, el.dataset.slot));
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => { if (!confirm('¿Cancelar este lavado?')) return; try { await API.cancelar(+b.dataset.cancel); toast('Lavado cancelado'); ir(); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => { try { await API.marcar(+b.dataset.mk, b.dataset.e); toast('Actualizado'); ir(); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => reporteHoja(+b.dataset.rep, +b.dataset.u));
  $('#rep').onclick = () => reporteHoja(null, null);
  const pb = $('#pushb'); if (pb) pb.onclick = () => alternarPush(pb.dataset.on === '1');
}

const pushPosible = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

const b64u8 = b => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function alternarPush(on) {

    const j = s.toJSON(); await API.guardarPush({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
    toast('¡Listo! Te avisaremos'); ir();

}

const diasDesde = t => Math.max(0, Math.floor((Date.now() - new Date(t).getTime()) / 864e5));
// Prioridad: gravedad + veces + desde cuándo + otros operadores que confirman + reincidencias + días esperando
function prioridad(f, todas) {
  const rein = todas.filter(x => x.id !== f.id && x.unidad === f.unidad && x.categoria === f.categoria && diasDesde(x.creado) <= 60).length;
  const p = ({ no_circula: 50, urgente: 30, normal: 10 })[f.gravedad] + ({ '1': 0, '2': 10, '3+': 20 })[f.veces] + ({ hoy: 0, semana: 5, mas_semana: 10, mas_mes: 15 })[f.desde]
    + Math.min(20, (f.confirmaciones || 0) * 5) + Math.min(20, rein * 10) + Math.min(20, diasDesde(f.creado) * 2);
  return { puntos: p, nivel: p >= 60 ? 'ALTA' : p >= 35 ? 'MEDIA' : 'BAJA', cls: p >= 60 ? 'mal' : p >= 35 ? 'warn' : '', rein };
}
function proximaGuardia() {
  const dias = String(E.aj.taller_dias || '1,3,5').split(',').map(Number); const d = new Date();
  for (let i = 0; i < 8; i++) { const x = new Date(d); x.setDate(d.getDate() + i); const dw = ((x.getDay() + 6) % 7) + 1; if (dias.includes(dw) && (i > 0 || d.getHours() < 18)) return iso(x); }
  return hoy();
}

      hojas.map((h, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>'],

    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      hojas.map((h, i) => '<sheet name="' + X(h.nombre.slice(0, 31)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets>' +
      '<definedNames>' + hojas.map((h, i) => h.filas.length > 1 ? '<definedName name="_xlnm._FilterDatabase" localSheetId="' + i + '" hidden="1">\'' + X(h.nombre.slice(0, 31)) + '\'!$A$1:$' + col(h.filas[0].length - 1) + '$' + h.filas.length + '</definedName>' : '').join('') + '</definedNames></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      hojas.map((h, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '<Relationship Id="rId' + (hojas.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B5ED7"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +

      const hi = m.findIndex(r => r.filter(c => /unidad|vehic|econ|km|kilom|distan|fecha|objeto/.test(norm(c))).length >= 2); if (hi < 0) throw new Error('No encontré encabezados de unidad y kilómetros');

      $('#gm').innerHTML = sel('gu', 'Columna de unidad', guess(/unidad|vehic|econ|objeto|nombre/)) + sel('gk', 'Columna de kilómetros', guess(/km|kilom|distan|recorr/)) + sel('gd', 'Columna de fecha', guess(/fecha|dia|date/), true) + '<p class="mut" id="gr" style="margin-top:8px"></p>';
      const arma = () => { const u = +$('#gu').value, k = +$('#gk').value, d = +$('#gd').value, porDia = {};
        m.slice(hi + 1).forEach(r => { const un = parseInt(String(r[u] ?? '').match(/\d{4}/)?.[0]), km = +String(r[k] ?? '').replace(/,/g, '').replace(/[^\d.]/g, ''), fe = d >= 0 ? aFecha(r[d]) : $('#gf').value;
          if (un && fe && km >= 0 && String(r[k] ?? '') !== '') porDia[fe + '|' + un] = (porDia[fe + '|' + un] || 0) + km; });

        $('#tr').innerHTML = '<b>' + filasT.length + '</b> cargas · <b>' + n1(filasT.reduce((s, x) => s + x.litros, 0)) + '</b> L'; $('#tb').disabled = !filasT.length; };
      $('#tm').onchange = arma; arma(); nomT = f.name;
